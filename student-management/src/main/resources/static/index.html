<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
        }
        .form-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background-color: #f9f9f9;
        }
        .table-container {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center my-4">Student Management</h1>

        <!-- Form to add a new student -->
        <div class="form-container">
            <h2>Add Student</h2>
            <form id="studentForm">
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
                <div class="mb-3">
                    <label for="grade" class="form-label">Grade</label>
                    <input type="text" class="form-control" id="grade" name="grade" required>
                </div>
                <button type="submit" class="btn btn-primary">Add Student</button>
            </form>
        </div>

        <!-- List all students -->
        <div class="table-container">
            <h2>Student List</h2>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Grade</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                    <!-- Student rows will be dynamically added here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Bootstrap JS (optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript to interact with the REST API -->
    <script>
        const API_BASE_URL = "http://localhost:8081/api/students";

        // Fetch all students and display them in the table
        async function fetchStudents() {
            const response = await fetch(API_BASE_URL);
            const students = await response.json();
            const tableBody = document.getElementById("studentTableBody");
            tableBody.innerHTML = ""; // Clear existing rows

            students.forEach(student => {
                const row = `
                    <tr>
                        <td>${student.id}</td>
                        <td>${student.name}</td>
                        <td>${student.grade}</td>
                        <td>
                            <button class="btn btn-warning btn-sm" onclick="editStudent(${student.id})">Edit</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteStudent(${student.id})">Delete</button>
                        </td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });
        }

        // Add a new student
        document.getElementById("studentForm").addEventListener("submit", async (event) => {
            event.preventDefault(); // Prevent form submission

            const name = document.getElementById("name").value;
            const grade = document.getElementById("grade").value;

            const response = await fetch(API_BASE_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({ name, grade }),
            });

            if (response.ok) {
                alert("Student added successfully!");
                fetchStudents(); // Refresh the student list
                document.getElementById("studentForm").reset(); // Clear the form
            } else {
                alert("Failed to add student.");
            }
        });

        // Delete a student
        async function deleteStudent(id) {
            if (confirm("Are you sure you want to delete this student?")) {
                const response = await fetch(`${API_BASE_URL}/${id}`, {
                    method: "DELETE",
                });

                if (response.ok) {
                    alert("Student deleted successfully!");
                    fetchStudents(); // Refresh the student list
                } else {
                    alert("Failed to delete student.");
                }
            }
        }

        // Edit a student
        async function editStudent(id) {
            // Fetch the student details
            const response = await fetch(`${API_BASE_URL}/${id}`);
            const student = await response.json();

            // Populate the form with the student details
            document.getElementById("name").value = student.name;
            document.getElementById("grade").value = student.grade;

            // Change the form to update mode
            const form = document.getElementById("studentForm");
            form.removeEventListener("submit", handleAddStudent); // Remove the add event listener
            form.addEventListener("submit", (event) => handleUpdateStudent(event, id)); // Add the update event listener
            form.querySelector("button").textContent = "Update Student";
        }

        // Handle updating a student
        async function handleUpdateStudent(event, id) {
            event.preventDefault(); // Prevent form submission

            const name = document.getElementById("name").value;
            const grade = document.getElementById("grade").value;

            const response = await fetch(`${API_BASE_URL}/${id}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({ name, grade }),
            });

            if (response.ok) {
                alert("Student updated successfully!");
                fetchStudents(); // Refresh the student list
                document.getElementById("studentForm").reset(); // Clear the form

                // Reset the form to add mode
                const form = document.getElementById("studentForm");
                form.removeEventListener("submit", handleUpdateStudent); // Remove the update event listener
                form.addEventListener("submit", handleAddStudent); // Add the add event listener
                form.querySelector("button").textContent = "Add Student";
            } else {
                alert("Failed to update student.");
            }
        }

        // Handle adding a student
        async function handleAddStudent(event) {
            event.preventDefault(); // Prevent form submission

            const name = document.getElementById("name").value;
            const grade = document.getElementById("grade").value;

            const response = await fetch(API_BASE_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({ name, grade }),
            });

            if (response.ok) {
                alert("Student added successfully!");
                fetchStudents(); // Refresh the student list
                document.getElementById("studentForm").reset(); // Clear the form
            } else {
                alert("Failed to add student.");
            }
        }

        // Load students when the page loads
        window.onload = fetchStudents;
    </script>
</body>
</html>
